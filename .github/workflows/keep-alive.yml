name: Keep Render Awake

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          echo "Pinging Render at $(date -u)"
          curl -s -o /dev/null -w "HTTP %{http_code}" https://bossyoki-bot.onrender.com/health || echo "Ping failed"
          echo "Done"
